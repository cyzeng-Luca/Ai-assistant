name: module-assistant-prod

services:
  postgres:
    image: crpi-sopllrs9xzm8ebi5.cn-beijing.personal.cr.aliyuncs.com/luca_z/luca_z_z:postgres-latest
    container_name: module-assistant-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-module_assistant}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: crpi-sopllrs9xzm8ebi5.cn-beijing.personal.cr.aliyuncs.com/luca_z/luca_z_z:redis-latest
    container_name: module-assistant-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    image: crpi-sopllrs9xzm8ebi5.cn-beijing.personal.cr.aliyuncs.com/luca_z/luca_z_z:server-latest
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: module-assistant-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-v4-pro}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-https://api.deepseek.com/anthropic}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-deepseek-v4-pro}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  client:
    image: crpi-sopllrs9xzm8ebi5.cn-beijing.personal.cr.aliyuncs.com/luca_z/luca_z_z:client-latest
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: module-assistant-client
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-80}:80"
    depends_on:
      - server

volumes:
  pgdata:
  redis-data:
